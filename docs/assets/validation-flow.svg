<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="310" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc"><title id="title">Quality Docs Validator workflow</title><desc id="desc">PFMEA and Control Plan workbooks feed a deterministic six-rule checker, which generates severity-classified potential findings for a human engineer.</desc><rect width="1100" height="310" rx="22" fill="#0d1726"/><text x="40" y="48" font-size="25" font-family="Arial,sans-serif" fill="#d6eee9" font-weight="700">PFMEA ↔ Control Plan consistency checks</text><rect x="40" y="92" width="190" height="80" rx="12" fill="#183650" stroke="#5fa6c6"/><text x="135" y="126" text-anchor="middle" font-family="Arial,sans-serif" fill="#ffffff" font-size="23" font-weight="700">PFMEA</text><text x="135" y="151" text-anchor="middle" font-family="Arial,sans-serif" fill="#b9d7e6" font-size="17">.xlsx workbook</text><rect x="40" y="185" width="190" height="80" rx="12" fill="#183650" stroke="#5fa6c6"/><text x="135" y="219" text-anchor="middle" font-family="Arial,sans-serif" fill="#ffffff" font-size="23" font-weight="700">Control Plan</text><text x="135" y="244" text-anchor="middle" font-family="Arial,sans-serif" fill="#b9d7e6" font-size="17">.xlsx workbook</text><path d="M230 132H278V175H320M230 225H278V175" stroke="#77decf" stroke-width="4" fill="none"/><path d="M320 175l-12 -7v14z" fill="#77decf"/><rect x="320" y="114" width="240" height="122" rx="14" fill="#164b4b" stroke="#76dccb"/><text x="440" y="153" text-anchor="middle" font-family="Arial,sans-serif" fill="#ffffff" font-size="23" font-weight="700">6 explicit checks</text><text x="440" y="183" text-anchor="middle" font-family="Arial,sans-serif" fill="#ccece8" font-size="17">Operation matching</text><text x="440" y="208" text-anchor="middle" font-family="Arial,sans-serif" fill="#ccece8" font-size="17">Severity-weighted score</text><path d="M560 175H616" stroke="#77decf" stroke-width="4"/><path d="M616 175l-12 -7v14z" fill="#77decf"/><rect x="616" y="114" width="205" height="122" rx="14" fill="#2d304e" stroke="#9c9bcf"/><text x="719" y="153" text-anchor="middle" font-family="Arial,sans-serif" fill="#fff" font-size="22" font-weight="700">Potential findings</text><text x="719" y="183" text-anchor="middle" font-family="Arial,sans-serif" fill="#dedcf7" font-size="18">Markdown · JSON</text><text x="719" y="208" text-anchor="middle" font-family="Arial,sans-serif" fill="#dedcf7" font-size="17">Terminal summary</text><path d="M821 175H860" stroke="#77decf" stroke-width="4"/><path d="M860 175l-12 -7v14z" fill="#77decf"/><rect x="860" y="114" width="200" height="122" rx="14" fill="#493626" stroke="#deb77f"/><text x="960" y="154" text-anchor="middle" font-family="Arial,sans-serif" fill="#ffffff" font-size="22" font-weight="700">Human review</text><text x="960" y="184" text-anchor="middle" font-family="Arial,sans-serif" fill="#f8e2c6" font-size="16">Engineer judges</text><text x="960" y="206" text-anchor="middle" font-family="Arial,sans-serif" fill="#f8e2c6" font-size="16">the findings</text><text x="40" y="292" font-family="Arial,sans-serif" fill="#bbcadb" font-size="15">Conceptual workflow diagram — not an application screenshot or compliance certification.</text></svg>